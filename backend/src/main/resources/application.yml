server:
  port: ${PORT:8080}

spring:
  application:
    name: learning-dashboard-backend
  jackson:
    default-property-inclusion: non_null

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/learning_dashboard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:learning_dashboard}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never Hibernate auto-DDL
    properties:
      hibernate:
        jdbc.batch_size: 25
        # Hibernate 6 autodetects the MySQL dialect from the JDBC driver -
        # no explicit hibernate.dialect needed, and safer not to hardcode
        # one that might drift from your actual RDS MySQL version.
  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Cognito User Pool issuer, e.g. https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXXXXXXX
          issuer-uri: ${COGNITO_ISSUER_URI:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Everything below is our own config, all env-driven, nothing hardcoded.
app:
  rag:
    related:
      # "Related concepts" panel. max-distance is cosine distance (lower = stricter);
      # calibrate with frontend/scripts/verify-related-concepts.mjs.
      top-k: ${RELATED_TOP_K:5}
      max-distance: ${RELATED_MAX_DISTANCE:0.35}
  cognito:
    user-pool-id: ${COGNITO_USER_POOL_ID:}
    region: ${COGNITO_REGION:us-east-1}
    app-client-id: ${COGNITO_APP_CLIENT_ID:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  ai:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}
    openai-api-key: ${OPENAI_API_KEY:}
    # Ordered fallback chains per capability - first provider is tried first,
    # remaining ones are only used if it fails after its own retries.
    text-provider-order: ${TEXT_PROVIDER_ORDER:claude,gemini}
    visual-provider-order: ${VISUAL_PROVIDER_ORDER:gemini}
    embedding-provider-order: ${EMBEDDING_PROVIDER_ORDER:gemini}
    claude-model: ${CLAUDE_MODEL:claude-sonnet-4-6}
    
    gemini-text-model: ${GEMINI_TEXT_MODEL:gemini-3.6-flash}
    gemini-visual-model: ${GEMINI_VISUAL_MODEL:gemini-3.1-flash-image}
    gemini-embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}  # text-embedding-004 was shut down 2026-01-14
    openai-text-model: ${OPENAI_TEXT_MODEL:gpt-4.1}
    request-timeout-ms: ${AI_REQUEST_TIMEOUT_MS:60000}
    max-retries: ${AI_MAX_RETRIES:2}

  rate-limit:
    explain:
      window-seconds: ${EXPLAIN_RATE_WINDOW_SECONDS:60}
      max-requests: ${EXPLAIN_RATE_MAX:10}
    visualize:
      window-seconds: ${VISUALIZE_RATE_WINDOW_SECONDS:60}
      max-requests: ${VISUALIZE_RATE_MAX:10}
    ask:
      window-seconds: ${ASK_RATE_WINDOW_SECONDS:60}
      max-requests: ${ASK_RATE_MAX:20}

  # Spark feed mix (Phase 8): concept shares by type bucket. Games, the other
  # 20% of cards, are added by the frontend (frontend/src/features/spark/config/feedMix.js).
  spark:
    mix:
      # Keys in [brackets]: Spring Boot strips "_" from unbracketed map keys, so "mind_map" would bind as "mindmap".
      weights:
        "[animation]": 60
        "[mind_map]": 15
        "[still]": 5
      bucket-of:
        "[image]": still
        "[diagram]": still
      default-weight: 5

  aws:
    region: ${AWS_REGION:us-east-1}
    sqs:
      generation-queue-url: ${GENERATION_QUEUE_URL:}
      generation-dlq-url: ${GENERATION_DLQ_URL:}
      wait-time-seconds: ${SQS_WAIT_TIME_SECONDS:20}    # long polling
      visibility-timeout-seconds: ${SQS_VISIBILITY_TIMEOUT_SECONDS:120}
      max-messages-per-poll: ${SQS_MAX_MESSAGES:5}
    s3:
      artifacts-bucket: ${ARTIFACTS_BUCKET:}
      presign-ttl-minutes: ${PRESIGN_TTL_MINUTES:60}

  worker:
    # Only the worker profile actually starts the SQS polling loop.
    poll-enabled: ${WORKER_POLL_ENABLED:true}

  gdpr:
    grace-period-days: ${GDPR_GRACE_PERIOD_DAYS:30}
    # Enable on exactly one instance/service in production - see AccountPurgeJob.
    purge-enabled: ${GDPR_PURGE_ENABLED:false}

  content-safety:
    # Comma-separated, empty by default - extend once shared/visible content exists.
    disallowed-terms: ${CONTENT_SAFETY_DISALLOWED_TERMS:}

management:
  endpoints:
    web:
      exposure:
        # Never wildcard "*" in production - this is intentionally an allow-list.
        include: health,info
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.learningdashboard.backend: INFO
    # Prints a line for every request that reaches this service at all -
    # including ones Spring Security or CORS reject before a controller
    # ever runs. See RequestLoggingConfig for why.
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
  pattern:
    # No request bodies / tokens in the default pattern - see LoggingSanitizer.
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: worker
server:
  port: ${PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health
