name: Backend

# Runs on every push/PR touching the backend. Uses real MySQL and Redis
# service containers (not mocks) so a green run means the same things
# your local run-log confirmed: the app actually compiles and its schema
# actually validates against a real database - not just "no obvious
# syntax errors".
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: learning_dashboard
          MYSQL_USER: learning_dashboard
          MYSQL_PASSWORD: learning_dashboard
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Wait for MySQL to accept connections
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot -proot --silent && break
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
      - name: Compile
        run: mvn -B -ntp clean compile

      - name: Run unit + schema-validation tests
        env:
          DB_URL: "jdbc:mysql://127.0.0.1:3306/learning_dashboard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
          DB_USERNAME: learning_dashboard
          DB_PASSWORD: learning_dashboard
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
          # Deliberately blank/fake - no test here should be making a real
          # outbound call to Anthropic/Gemini/OpenAI. If a test needs a
          # provider, it must mock TextGenerationProvider/etc., never call
          # a real adapter class with a real key from CI.
          ANTHROPIC_API_KEY: "test-key-not-real"
          GEMINI_API_KEY: "test-key-not-real"
          OPENAI_API_KEY: "test-key-not-real"
          COGNITO_ISSUER_URI: "https://example-not-a-real-pool.invalid"
          CORS_ALLOWED_ORIGINS: "http://localhost:5173"
        run: mvn -B -ntp test

      - name: Package (skip tests, already ran above)
        run: mvn -B -ntp package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # Builds the Docker image and pushes it to GitHub Container Registry.
  # The same image runs as the API or, with SPRING_PROFILES_ACTIVE=worker,
  # as the worker. Needs no secrets beyond the built-in GITHUB_TOKEN.
  publish-image:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/reknit-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dependency-check:
    runs-on: ubuntu-latest
    # Separate job so a flaky/slow vulnerability-DB download never blocks
    # the build-and-test signal above from reporting.
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # Cache the vulnerability database so only the first run (and
      # a weekly refresh) pays the full download cost.
      - name: Cache Dependency-Check database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: depcheck-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            depcheck-data-${{ runner.os }}-

     
      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          mvn -B -ntp org.owasp:dependency-check-maven:12.1.0:check
          -Dformat=HTML
          -DfailBuildOnCVSS=7
          -DnvdApiKey="$NVD_API_KEY"
          -DoutputDirectory=${{ github.workspace }}/reports

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
          retention-days: 30
